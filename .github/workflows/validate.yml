name: Validate

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  tests:
    name: Tests (HA ${{ matrix.ha }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            ha: "2026.3.0"
          - python: "3.14.7"
            ha: "2026.8.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime and test dependencies
        env:
          HA_VERSION: ${{ matrix.ha }}
        run: python -m pip install -r requirements.txt 'pytest>=8.0' "homeassistant==${HA_VERSION}"
      - name: Check integration syntax
        run: python -m compileall -q custom_components/narwal
      - name: Run tests
        run: python -m pytest -q

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
