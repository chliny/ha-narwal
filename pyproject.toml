[project]
name = "narwal-integration"
version = "0.5.8"
description = "Home Assistant integration for Narwal robot vacuums via cloud MQTT"
requires-python = ">=3.14.7"
license = "MIT"
dependencies = [
    "bbpb==1.4.2",
    "Pillow>=9.1.0",
    "paho-mqtt==2.1.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.8",
    "Pillow>=10.0",
    "pytest>=8.0",
    "homeassistant==2026.8.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Home Assistant subclasses aiohttp.web.Application during import.
    "ignore:Inheritance class HomeAssistantApplication from web\\.Application is discouraged:DeprecationWarning",
]
